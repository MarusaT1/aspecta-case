name: CI/CD Pipeline

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: DockerHub login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}

    - name: Build and Push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}

    - name: Docker tags update in values.yaml
      run: |
        sed -i 's|tag: .*|tag: '${{ github.sha }}'|g' charts/webapp/values.yaml
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add charts/webapp/values.yaml
        git commit -m "GitOps: Docker tags updated to ${{ github.sha }}" || exit 0
        git push
