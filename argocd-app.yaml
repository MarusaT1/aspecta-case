apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aspecta-case
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@github.com:MarusaT1/aspecta-case.git'
    targetRevision: HEAD
    path: 'charts/webapp'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
